<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рецепт</title>
</head>

<body>

<article class="recipe2">


    <!-- TEMPLATE название -->
    <h1>
        RECIPE_NAME
    </h1>


    <!-- TEMPLATE фото блюда -->
    <img
        src="RECIPE_IMAGE"
        alt="RECIPE_NAME"
    >

    <section class="steps">

        <ol>

            <!-- TEMPLATE шаг -->

            <li class="step">

                <!-- TEMPLATE название/номер шага -->
                <h2>
                    Шаг STEP_NUMBER
                </h2>

                <!-- TEMPLATE текст шага -->
                <p>
                    STEP_TEXT
                </p>

                <!-- TEMPLATE фото шага -->
                <img
                    src="STEP_IMAGE"
                    alt="Шаг STEP_NUMBER"
                >

            </li>

        </ol>

    </section>


    <!-- TEMPLATE оценки/лайки -->
    <div class="rating">
        Оценки/лайки: RATING/LIKES
    </div>

</article>

</body>
</html>
